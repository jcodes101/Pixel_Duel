<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL DUEL</title>
<style>
:root{--dark:#1b1b32;--mid:#3d5a80;--light:#98c1d9;--bright:#eeefbd}
*{box-sizing:border-box}body{background:var(--dark);color:var(--bright);font:16px monospace;text-align:center;margin:0;padding:24px}
h1{font-size:34px;letter-spacing:4px}button,input{font:inherit;border:3px solid var(--light);background:var(--mid);color:var(--bright);padding:10px;cursor:pointer}
button:hover:not(:disabled){background:var(--light);color:var(--dark)}button:disabled{opacity:.4;cursor:not-allowed}
input{width:140px;text-align:center;text-transform:uppercase}canvas{display:block;width:100%;max-width:640px;margin:16px auto;image-rendering:pixelated;border:4px solid var(--light);background:var(--dark)}
#moves{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}#log{height:135px;overflow-y:auto;text-align:left;border:2px solid var(--mid);padding:8px;max-width:640px;margin:15px auto;font-size:13px}
#log div{padding:3px}#game,#over{display:none}#status{min-height:25px}#roomLabel{letter-spacing:2px}
</style></head><body>
<h1>PIXEL DUEL</h1>
<section id="lobby"><p>Create a room or enter a friend's 4-letter code.</p>
<input id="roomInput" maxlength="4" placeholder="CODE" aria-label="Room code">
<button id="join">JOIN / CREATE</button><p id="error"></p></section>
<section id="game"><p id="roomLabel"></p><p id="status"></p>
<canvas id="field" width="320" height="180" aria-label="Pixel duel battlefield"></canvas>
<div id="moves"></div><div id="log" aria-label="Action log"></div></section>
<section id="over"><h2 id="winner"></h2><button id="rematch">REMATCH</button><p id="vote"></p></section>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(), $=id=>document.getElementById(id);
const canvas=$('field'), ctx=canvas.getContext('2d');
const colors=['#1b1b32','#3d5a80','#98c1d9','#eeefbd'];
const names=['Attack','Defend','Heal','Special'];
let state=null, shakeUntil=0, lastRound=-1, lastPhase='', lastResult=null;
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function sprite(x,y,flipped,hp){
  ctx.save();ctx.translate(x,y);if(flipped)ctx.scale(-1,1);
  rect(-12,-34,24,25,colors[1]);rect(-9,-44,18,12,colors[2]);
  rect(-7,-41,4,4,colors[0]);rect(4,-41,4,4,colors[0]);
  rect(-12,-9,9,17,colors[2]);rect(3,-9,9,17,colors[2]);
  rect(-19,-29,7,18,colors[2]);rect(12,-29,7,18,colors[2]);
  rect(16,-25,15,5,colors[3]);ctx.restore();
  rect(x-27, y-65,54,6,colors[0]);rect(x-26,y-64,52*Math.max(0,hp)/100,4,colors[3]);
}
function draw(t=0){
  ctx.save();ctx.clearRect(0,0,320,180);
  if(t<shakeUntil)ctx.translate(Math.random()*6-3,Math.random()*6-3);
  rect(0,0,320,180,colors[0]);
  for(let i=0;i<22;i++)rect((i*43)%320,(i*29)%105,2,2,colors[1]);
  rect(0,133,320,47,colors[1]);rect(0,133,320,4,colors[2]);
  for(let i=0;i<16;i++)rect(i*22,155+(i%2)*10,13,3,colors[0]);
  if(state?.players?.length===2){
    sprite(75,131,false,state.players[0].hp);
    sprite(245,131,true,state.players[1].hp);
    ctx.fillStyle=colors[3];ctx.font='10px monospace';
    ctx.fillText('P1 '+state.players[0].hp+' HP',42,18);
    ctx.fillText('P2 '+state.players[1].hp+' HP',211,18);
    if(lastResult && t<shakeUntil){
      ctx.fillText('-'+lastResult.damage[0],53,48);
      ctx.fillText('-'+lastResult.damage[1],226,48);
    }
  }
  ctx.restore();requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
$('join').onclick=()=>socket.emit('join',$('roomInput').value,res=>{
  if(res.error){$('error').textContent=res.error;return;}
  $('lobby').style.display='none';$('game').style.display='block';
});
function render(s){
  state=s;$('roomLabel').textContent='ROOM '+s.code+' | ROUND '+s.round;
  const me=s.players[s.you], enemy=s.players[1-s.you];
  $('status').textContent=s.phase==='WAITING'?'Waiting for opponent...':
    s.phase==='RESOLVING'?'Resolving moves...':
    s.phase==='GAME_OVER'?'Duel finished':
    me.locked?'Locked in — waiting for opponent...':
    enemy.locked?'Opponent locked in — choose your move':'Choose your move';
  $('moves').replaceChildren();
  if(s.phase==='SELECT')names.forEach(name=>{
    const b=document.createElement('button');
    b.textContent=name+(name==='Special'&&me.cooldown?' ('+me.cooldown+')':'');
    b.disabled=me.locked||(name==='Special'&&me.cooldown>0);
    b.onclick=()=>{b.disabled=true;socket.emit('move',name)};
    $('moves').append(b);
  });
  if(s.phase==='RESOLVING'&&(lastPhase!=='RESOLVING'||lastRound!==s.round)){
    shakeUntil=performance.now()+450;lastResult=s.result;
  }
  lastRound=s.round;lastPhase=s.phase;
  $('log').replaceChildren();s.log.forEach(line=>{
    const d=document.createElement('div');d.textContent=line;$('log').append(d);
  });$('log').scrollTop=$('log').scrollHeight;
  $('over').style.display=s.phase==='GAME_OVER'?'block':'none';
  if(s.phase==='GAME_OVER'){
    $('winner').textContent=s.result.winner===-1?'DRAW!':
      s.result.winner===s.you?'YOU WIN!':'YOU LOSE!';
    $('vote').textContent=s.rematchVotes+'/2 players ready';
  }
}
socket.on('state',render);
$('rematch').onclick=()=>{socket.emit('rematch');$('rematch').disabled=true;};
socket.on('state',s=>{if(s.phase==='SELECT')$('rematch').disabled=false;});
function leave(msg){state=null;lastResult=null;lastPhase='';$('game').style.display='none';
  $('over').style.display='none';$('lobby').style.display='block';$('error').textContent=msg;}
socket.on('opponentLeft',()=>leave('Opponent disconnected. Create or join another room.'));
socket.on('disconnect',()=>leave('Disconnected from server. Refresh to reconnect.'));
</script></body></html>
